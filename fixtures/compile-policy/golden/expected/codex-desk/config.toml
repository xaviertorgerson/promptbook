# Compiled from agent-policy.yaml (profile desk, tier auto) by promptbook compile-policy.
# A fragment: merge into ~/.codex/config.toml; recompile rather than edit.

default_permissions = "promptbook"
approval_policy = "on-request"

[permissions.promptbook]
description = "Compiled from agent-policy.yaml (profile desk, tier auto) by promptbook compile-policy"
extends = ":workspace"

[permissions.promptbook.filesystem]
"~/.ssh/**" = "deny"
"/etc/shadow" = "deny"
"~/.cache/pnpm" = "write"

[permissions.promptbook.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/secrets/**" = "deny"
".git/hooks/**" = "read"
"." = "write"

[permissions.promptbook.network]
enabled = true

[permissions.promptbook.network.domains]
"**.internal.example.com" = "deny"
"**.github.com" = "allow"
"registry.npmjs.org" = "allow"
"tracking.example.com" = "deny"

[features]
network_proxy = true
