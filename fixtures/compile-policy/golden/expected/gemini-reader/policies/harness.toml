# Compiled from agent-policy.yaml (profile reader, tier read-only) by harness compile-policy.
# User-tier policy (~/.gemini/policies/); the workspace tier is disabled upstream. Tool names other than
# read_file, glob, write_file, replace and run_shell_command are unverified (adapters/gemini).

[[rule]]
toolName = ["read_file", "read_many_files", "glob", "search_file_content"]
argsPattern = "\"[A-Za-z_]*paths?\":\\[?(?:\"[^\"]*\",)*\"(?:[^\"]*/)?\\.env\""
decision = "deny"
priority = 900
denyMessage = "deny_read **/.env (agent-policy.yaml)"

[[rule]]
toolName = ["read_file", "read_many_files", "glob", "search_file_content"]
argsPattern = "\"[A-Za-z_]*paths?\":\\[?(?:\"[^\"]*\",)*\"(?:[^\"]*/)?secrets/[^\"]*\""
decision = "deny"
priority = 900
denyMessage = "deny_read **/secrets/** (agent-policy.yaml)"

[[rule]]
toolName = ["read_file", "read_many_files", "glob", "search_file_content"]
argsPattern = "\"[A-Za-z_]*paths?\":\\[?(?:\"[^\"]*\",)*\"[^\"]*/\\.ssh/[^\"]*\""
decision = "deny"
priority = 900
denyMessage = "deny_read ~/.ssh/** (agent-policy.yaml)"

[[rule]]
toolName = ["read_file", "read_many_files", "glob", "search_file_content"]
argsPattern = "\"[A-Za-z_]*paths?\":\\[?(?:\"[^\"]*\",)*\"/etc/shadow\""
decision = "deny"
priority = 900
denyMessage = "deny_read /etc/shadow (agent-policy.yaml)"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "rm -rf /"
decision = "deny"
priority = 900
denyMessage = "never wipe the root"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git push --force"
decision = "deny"
priority = 900
denyMessage = "no force-push of shared branches"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git push -f"
decision = "deny"
priority = 900
denyMessage = "no force-push of shared branches"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git push --mirror"
decision = "deny"
priority = 900
denyMessage = "no force-push of shared branches"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git push +"
decision = "deny"
priority = 900
denyMessage = "no force-push of shared branches"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "docker compose down -v"
decision = "deny"
priority = 900
denyMessage = "the stack's volumes hold its only data"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "docker compose down --volumes"
decision = "deny"
priority = 900
denyMessage = "the stack's volumes hold its only data"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "docker-compose down -v"
decision = "deny"
priority = 900
denyMessage = "the stack's volumes hold its only data"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "docker-compose down --volumes"
decision = "deny"
priority = 900
denyMessage = "the stack's volumes hold its only data"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "herdr workspace close"
decision = "deny"
priority = 900
denyMessage = "closing a workspace can end a worktree group"

[[rule]]
toolName = ["write_file", "replace"]
argsPattern = "\"[A-Za-z_]*paths?\":\\[?(?:\"[^\"]*\",)*\"(?:[^\"]*/)?\\.git/hooks/[^\"]*\""
decision = "deny"
priority = 900
denyMessage = "hooks run on every commit"

[[rule]]
toolName = "web_fetch"
argsPattern = "https?://(?:[^/\"]*\\.)?internal\\.example\\.com(?:[:/\"]|$)"
decision = "deny"
priority = 900
denyMessage = "internal hosts are not for agents"

[[rule]]
toolName = "mcp_prod-db_execute"
decision = "deny"
priority = 900
denyMessage = "no writes to the production database"

[[rule]]
toolName = "run_shell_command"
commandPrefix = "psql"
decision = "ask_user"
priority = 500

[[rule]]
toolName = ["write_file", "replace"]
argsPattern = "\"[A-Za-z_]*paths?\":\\[?(?:\"[^\"]*\",)*\"(?:[^\"]*/)?infra/[^\"]*\""
decision = "ask_user"
priority = 500

[[rule]]
toolName = "google_web_search"
decision = "ask_user"
priority = 500

[[rule]]
toolName = "run_shell_command"
commandPrefix = "pnpm"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git status"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git log"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git diff"
decision = "allow"
priority = 100

[[rule]]
toolName = "web_fetch"
argsPattern = "https?://(?:[^/\"]*\\.)?github\\.com(?:[:/\"]|$)"
decision = "allow"
priority = 100
