# A policy that exercises every mapping in adapters/{claude,codex,gemini}/README.md and compiles on
# all three engines, with the degradations each engine needs accepted by name. The goldens next to
# it (expected/<engine>-<profile>/) are what tests/compile-policy.test.mjs compares against.
policy_version: 1
owner: operator
profiles:
  devbox: { tier: autonomous, engines: [claude, codex, gemini], description: "sandboxed devbox; production unreachable by network ACL", requires: [prod-unreachable-from-this-host, non-root-container] }
  laptop: { tier: auto-edit, engines: [claude, codex, gemini] }
  # The engine's classifier reviews each action (Claude's auto mode); stricter where an engine has
  # none. Its own sandbox and egress override the top-level ones key by key: it starts without the
  # sandbox where it cannot run one, fetches without a deny default, and lets sandboxed commands
  # authenticate to GitHub and npm with masked credentials.
  desk:
    tier: auto
    engines: [claude, codex, gemini]
    sandbox:
      fail_if_unavailable: false
      credentials:
        - { path: ~/.config/gh/hosts.yml, extract: "oauth_token:\\s*(\\S+)", inject_hosts: [api.github.com], reason: gh authenticates inside the sandbox without reading the token }
        - { env: NPM_TOKEN, inject_hosts: [registry.npmjs.org] }
    egress: { default: allow }
  reader: { tier: read-only, engines: [claude, codex, gemini] }
  ci: { tier: unattended, engines: [claude, codex, gemini] }
deny_read:
  - "**/.env"
  - "**/secrets/**"
  - "~/.ssh/**"
  - /etc/shadow
forbid:
  - { command: [rm, -rf, /], reason: never wipe the root }
  - { command: [git, push, [--force, -f]], reason: no force-push of shared branches, examples: [git push --force origin main, git push -f] }
  - { command: [herdr, workspace, close], reason: closing a workspace can end a worktree group, examples: [herdr workspace close w2] }
  - { write: "**/.git/hooks/**", reason: hooks run on every commit }
  - { tool: web-fetch, domain: "**.internal.example.com", reason: internal hosts are not for agents }
  - { tool: "mcp:prod-db:execute", reason: no writes to the production database }
ask:
  - { command: [psql], reason: a database shell is a human checkpoint }
  - { write: "infra/**", reason: infrastructure edits are reviewed live }
  - { tool: web-search }
allow:
  - { command: [pnpm] }
  - { command: [git, [status, log, diff]], examples: [git status, git log --oneline] }
  - { write: "**" }
  - { tool: web-fetch, domain: "**.github.com" }
egress:
  default: deny
  allow_domains: ["**.github.com", registry.npmjs.org]
  deny_domains: [tracking.example.com]
sandbox:
  enabled: true
  fail_if_unavailable: true
  writable_roots: ["~/.cache/pnpm"]
requires_config:
  prod_hosts: ["10.20.0.5:5432", "prod.internal.example.com"]
  connect_timeout_ms: 2000
budgets:
  unattended: { max_turns: 200, max_usd: 5, max_minutes: 60 }
  autonomous: { max_usd: 20 }
# An entry without profiles covers every profile but the bypass tier's; the devbox's gaps name it.
accept_gaps:
  - { engine: claude, field: egress, profiles: [devbox], reason: "WebFetch under bypass reaches unlisted domains; the devbox's network ACL is the egress boundary" }
  - { engine: codex, field: forbid, profiles: [devbox, laptop, desk, reader, ci], reason: "the write deny downgrades sandboxed commands only; apply_patch is covered by the project hook" }
  - { engine: codex, field: sandbox, profiles: [devbox], reason: "the devbox image fails to start without its sandbox" }
  - { engine: codex, field: sandbox, reason: "on the desk, Codex commands read the gh and npm credentials as they did before the masks; elsewhere the launcher refuses to start Codex without its sandbox" }
  - { engine: codex, field: allow, reason: "git status, log and diff read the forge's object store outside the sandbox; nothing they print is a secret the policy denies" }
  - { engine: codex, field: ask, profiles: [ci], reason: "unattended, infra/** is read-only for sandboxed commands and apply_patch there is refused by the project hook; a web search reads public pages and writes nothing" }
  - { engine: codex, field: budgets, profiles: [devbox], reason: "the devbox's spend is watched by the operator, who is reachable; neither engine reports cost" }
  - { engine: gemini, field: deny_read, profiles: [devbox, laptop, desk, reader, ci], reason: "Gemini runs in a container without the secret files mounted" }
  - { engine: gemini, field: forbid, profiles: [devbox, laptop, desk, reader, ci], reason: "shell redirection into .git/hooks is denied by the project hook" }
  - { engine: gemini, field: egress, profiles: [devbox, laptop, desk, reader, ci], reason: "the container's proxy enforces the domain list" }
  - { engine: gemini, field: sandbox, profiles: [devbox, laptop, desk, reader, ci], reason: "the launcher refuses to start without the container, which mounts no gh or npm credentials" }
  - { engine: gemini, field: budgets, profiles: [devbox], reason: "the devbox's spend is watched by the operator, who is reachable; neither engine reports cost" }
  - { engine: gemini, field: tier, profiles: [devbox], reason: "YOLO only inside the devbox container, measured against a deny probe before use" }
