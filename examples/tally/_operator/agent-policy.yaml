# dana's operator policy (L1). It lives in her dotfiles (home/.chezmoidata/agent-policy.yaml) and is
# copied here so the worked example shows every layer; nothing in the product repository reads it.
# It decides how often an agent asks on each of her machines. The product's walls (L2) and the
# runtime's caps (L4) sit on top of it and it cannot loosen either.
# compiled/<engine>/<profile>/ holds `harness compile-policy` output for every engine a profile
# installs; tests/example.test.mjs recompiles it and fails on any difference.
policy_version: 1
owner: dana
profiles:
  workstation:
    tier: auto-edit
    engines: [claude, codex]
    description: "dana's laptop: interactive; edits without asking, commands and the asks below prompt her; the policy's sandbox on"
  devbox:
    tier: autonomous
    engines: [claude]
    requires: [prod-unreachable-from-this-host, non-root-container]
    description: "the always-on box the coordinator (claude) runs on: production is unreachable from it by the tailnet ACL and agents run non-root in a container; dana is reachable by phone"
  ci:
    tier: unattended
    engines: [claude, codex, gemini]
    description: "headless runs the coordinator launches, each in its role below: authors (claude), readers (claude or codex), the evaluator (gemini). No prompts, every ask a denial, the role's allow list is the boundary, caps from budgets.unattended"
# Who runs headless on ci (WALKTHROUGH, Cast) and what each run may do. A role only narrows the
# profile; ci compiles to one set of files per role under compiled/<engine>/ci/roles/.
roles:
  author:
    description: "tally-coder: implements a task on its branch, pushes it and opens the draft PR"
    engines: [claude]
  reader:
    description: "tally-reader: reads code and history for the coordinator; writes nothing"
    engines: [claude, codex]
    read_only: true
    allow:
      - { command: [git, [status, log, diff, show]] }
  evaluator:
    description: "tally-evaluator: re-runs the checks on a head and returns a verdict; writes nothing"
    engines: [gemini]
    read_only: true
    allow:
      - { command: [git, [status, log, diff, show]] }
      - { command: [pnpm, [test, lint, typecheck]] }
deny_read:
  - "**/.env"
  - "**/.env.*"
  - "**/secrets/**"
  - "~/.ssh/**"
  - "~/.config/shell/secrets.sh"
forbid:
  - { command: [git, push], flags_anywhere: [--force, -f, --mirror, "+*"], reason: no force-push of shared branches, examples: [git push --force origin integration/settle-up, git push -f, git push origin integration/settle-up -f, git push origin +integration/settle-up] }
  - { command: [rm, -rf, /], reason: never wipe the root }
  - { command: [dropdb], reason: no destructive data actions }
  - { command: [docker, volume, rm], reason: volumes hold the only copy of local data, examples: [docker volume rm tally_pgdata] }
  - { write: "**/.git/hooks/**", reason: hooks run on every commit }
# The guard hook denies a forbidden command however it is spelled (compound, wrapped, sh -c), on
# the engines that share the hook protocol; the product's own hook deny (L2) stays the wall.
hooks:
  forbid_guard: true
ask:
  - { command: [psql], reason: a database shell is a human checkpoint, examples: [psql app_feat_split_4_revoke_link] }
  - { write: "deploy/**", reason: deploy configuration is reviewed live }
allow:
  - { command: [git, [status, log, diff, show, branch, add, commit, fetch, pull, push, switch, checkout, worktree]], examples: [git status, git push origin feat/split-2-save-once] }
  - { command: [gh, pr, [create, view, ready, comment]], examples: [gh pr create --draft --base integration/settle-up] }
  - { command: [pnpm] }
  - { command: [node] }
  - { write: "**" }
egress:
  default: deny
  allow_domains: ["**.github.com", registry.npmjs.org, forge.example.com]
sandbox:
  enabled: true
  fail_if_unavailable: true
# What the devbox's requires are probed against (harness check-requires; harness run refuses the
# devbox's runs until they pass): production's database and API, which the tailnet ACL drops.
requires_config:
  prod_hosts: ["10.40.0.12:5432", "api.tally.example.com:443"]
budgets:
  unattended: { max_turns: 120, max_usd: 4, max_minutes: 90 }
  autonomous: { max_usd: 20 }
# Fail closed: each engine below cannot express one of the fields above, and the compiler refuses
# until the degradation is accepted here with the reason it is safe on dana's machines.
accept_gaps:
  - { engine: claude, field: egress, profiles: [devbox], reason: "under bypass on the devbox, WebFetch reaches unlisted domains; the devbox container's egress proxy enforces the same domain list for every process" }
  - { engine: codex, field: forbid, profiles: [ci], reason: "Codex runs only the reader on ci, in the :read-only sandbox; apply_patch, which no documented rule holds to it, is refused by the product's walls (L2 hook deny) under .git/hooks, and the reader's checkout is a throwaway worktree the coordinator discards" }
  - { engine: codex, field: forbid, reason: "the .git/hooks write deny downgrades sandboxed commands only; the product's walls (L2 hook deny) refuse apply_patch there" }
  - { engine: codex, field: ask, profiles: [ci], reason: "unattended, the deploy/** ask is a denial: the path is read-only for sandboxed commands, and the product's walls (L2 hook deny) refuse apply_patch there" }
  - { engine: codex, field: sandbox, reason: "the launcher refuses to start Codex where its sandbox is unavailable" }
  - { engine: gemini, field: deny_read, reason: "Gemini runs only the evaluator, in the ci container, which mounts no secret files" }
  - { engine: gemini, field: forbid, reason: "Gemini runs only the read-only evaluator: write_file and replace are denied, its shell runs only git reads and the test commands, its forge token cannot push, and a shell redirection is refused by the product's hook deny" }
  - { engine: gemini, field: egress, reason: "the ci container's egress proxy enforces the domain list" }
  - { engine: gemini, field: sandbox, reason: "the launcher refuses to start the evaluator outside its container" }
