# The walkthrough's unattended phase, replayed under its faults (WALKTHROUGH.md, steps 19-35): from
# the morning after the skeleton merged (SPLIT-1 merged; it was high risk and ran supervised) until
# dana merges integration/settle-up into main. Run it with
#   node tools/cli.mjs simulate examples/tally/simulate.yaml --seeds 1..50
# The faults it replays:
#   ask                  SPLIT-4's author wants a database shell; the ci profile is unattended, so
#                        the ask is a denial that must reach dana as needs-human, never an approval
#   evaluator_rejection  the evaluator fails SPLIT-2's first head; the author fixes it; the next head passes
#   lost_events          a tenth of the wakes are lost, some with no events-lost notice; the coordinator
#                        recovers from notices and check-ins, never by guessing
#   integration branch   tasks land on integration/settle-up under GRANT-2, which no merge queue
#                        serves (queue_targets: main); dana merges the branch into main herself
# Tasks, the grant and the policy are copies of the project's own files; tests/example.test.mjs
# fails if they drift. The simulator holds one grant per runtime, so it carries GRANT-2 (the one
# its invariants exercise); GRANT-1's budget is the runtime budget (supervisor.budget_usd).
name: tally-settle-up
description: Tally's settle-up epic after the skeleton, under the walkthrough's faults.
seed: 1
start: "2026-10-15T08:00:00Z"
repo: tally/tally
target: main
strategy: merge
policy:
  tier: unattended
  forbid:
    - { command: [git, push, [--force, -f]] }
    - { command: [rm, -rf, /] }
    - { command: [dropdb] }
    - { command: [docker, volume, rm] }
  ask:
    - { command: [psql] }
  budgets: { max_turns: 120, max_usd: 4 }
supervisor: { max_workers: 3, budget_usd: 30 }
merge: { queue_targets: [main] }
human: { name: dana, on_integration: merge }
grant:
  id: GRANT-2
  granted_by: dana
  granted_to: { role: orchestrator, runtime: multiplexer-coordinator }
  granted_at: "2026-10-13T21:45:00Z"
  source: "https://forge.example.com/tally/tally/issues/1#issuecomment-4"
  scope:
    objective: Integrate reviewed settle-up PRs on integration/settle-up
    repositories: [tally/tally]
    epics: [settle-up]
    non_goals: [merging into main, any repository other than tally/tally]
  actions:
    - action: merge
      repo: tally/tally
      target: integration/settle-up
      strategy: merge
      requires: [independent-review, required-checks, current-head]
  limits:
    max_workers: 3
    budget: { max_usd: 5 }
    stop_when:
      - a merge conflict that is not mechanical
      - the checks on the merged result fail
  expires_at: "2026-10-27T21:45:00Z"
  revocable: true
faults:
  ask: { tasks: [SPLIT-4], command: [psql, app_feat_split_4_revoke_link] }
  evaluator_rejection: { tasks: { SPLIT-2: 1 } }
  lost_events: { rate: 0.1, notice_rate: 0.7 }
tasks:
  - id: SPLIT-1
    epic: settle-up
    priority: P0
    size: M
    risk: high
    status: merged
    owner: dana
    touches: [src/**, tests/**, migrations/**, deploy/**]
    depends_on: []
    criteria: [AC-1, AC-2, AC-3, AC-4, AC-5]
    budget: { max_turns: 200, max_usd: 6, max_minutes: 150 }
  - id: SPLIT-2
    epic: settle-up
    priority: P1
    size: S
    risk: medium
    lands_to: integration/settle-up
    touches: [src/bills/**, src/web/bills/**, migrations/**, tests/bills/**]
    depends_on: [SPLIT-1]
    criteria: [AC-1, AC-2, AC-3, AC-4]
    budget: { max_turns: 100, max_usd: 3, max_minutes: 90 }
  - id: SPLIT-3
    epic: settle-up
    priority: P1
    size: M
    risk: medium
    lands_to: integration/settle-up
    touches: [src/household/**, src/ledger/**, src/web/household/**, migrations/**, tests/household/**]
    depends_on: [SPLIT-1, SPLIT-2]
    criteria: [AC-1, AC-2, AC-3, AC-4, AC-5]
    budget: { max_turns: 150, max_usd: 5, max_minutes: 120 }
  - id: SPLIT-4
    epic: settle-up
    priority: P1
    size: S
    risk: medium
    lands_to: integration/settle-up
    touches: [src/links/**, src/web/revoked/**, tests/links/**]
    depends_on: [SPLIT-1]
    criteria: [AC-1, AC-2, AC-3]
    budget: { max_turns: 100, max_usd: 3, max_minutes: 90 }
