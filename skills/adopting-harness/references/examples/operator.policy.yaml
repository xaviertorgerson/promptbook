# An operator's policy for three machine profiles. The devbox's autonomous tier is allowed only
# because production is unreachable from it at the network level and agents run non-root in a
# container; `requires` names those preconditions so the compile refuses the tier without them, and
# `harness check-requires` probes them on the host (`harness run` refuses the profile's runs until they
# pass). requires_config lists the production endpoints the devbox must not reach.
policy_version: 1
owner: you
profiles:
  laptop: { tier: auto-edit, engines: [claude, codex], description: "interactive; sandbox on" }
  devbox: { tier: autonomous, engines: [claude, codex], requires: [prod-unreachable-from-this-host, non-root-container], description: "production unreachable by network ACL from this host; agents run non-root in a container" }
  ci: { tier: unattended, engines: [claude], description: "headless runs: no-prompt mode plus the allow list below; caps from budgets.unattended" }
deny_read:
  - "**/.env"
  - "**/.env.*"
  - "**/secrets/**"
  - "~/.ssh/**"
  - "~/.aws/**"
forbid:
  - { command: [git, push], flags_anywhere: [--force, -f, --mirror, "+*"], reason: no force-push of shared branches, examples: [git push origin main --force, git -C . push -f] }
  - { command: [rm, -rf, /], reason: never wipe the root }
  - { command: [terraform, apply], reason: infrastructure changes go through review }
  - { command: [dropdb], reason: no destructive data actions }
ask:
  - { command: [psql], reason: a database shell is a human checkpoint }
allow:
  - { command: [git, [status, log, diff, show, branch, add, commit, fetch, pull, switch, checkout]], examples: [git status, git fetch origin] }
  - { command: [node] }
  - { command: [npm] }
  - { write: "**" }
egress:
  default: deny
  allow_domains: ["**.github.com", registry.npmjs.org, forge.example.com]
sandbox: { enabled: true, fail_if_unavailable: true }
requires_config:
  prod_hosts: ["db.prod.example.com:5432", "api.example.com"]
budgets:
  unattended: { max_turns: 200, max_usd: 5 }
  autonomous: { max_usd: 20 }
