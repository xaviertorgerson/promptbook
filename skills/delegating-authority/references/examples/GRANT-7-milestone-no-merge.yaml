# The human: "Deliver the rating-engine milestone in acme/billing against its spec. Choose and
# sequence tasks, approve implementation plans, and route material in-scope fixes. Use at most four
# worker agents concurrently. Prepare reviewed draft PRs, but leave finalization and merging to me.
# Ask about product decisions, broader scope or repeated non-progress; stop when the milestone is
# delivered." Finalization and merge are deliberately absent: reserved to the human.
id: GRANT-7
granted_by: maria
granted_to: { role: orchestrator, runtime: multiplexer-coordinator }
granted_at: "2026-10-13T09:00:00Z"
source: "https://forge.example.com/acme/billing/issues/300#issuecomment-4"
scope:
  objective: Deliver the rating-engine milestone against specs/rating-engine/spec.md
  repositories: [acme/billing]
  epics: [rating-engine]
  non_goals: [invoicing, tax, any change to the public API contract]
actions:
  - select-tasks
  - approve-plan
  - { action: dispose-findings, policy: "Fix material in-scope findings in the same PR; file tangential ones as follow-up tasks; never drop a correctness or security finding" }
limits:
  max_workers: 4
  budget: { max_usd: 80 }
  stop_when:
    - the milestone's acceptance in specs/rating-engine/spec.md holds on the integrated result
    - two consecutive runs on one task make no progress
    - a consequential product decision is needed
expires_at: "2026-10-27T09:00:00Z"
revocable: true
